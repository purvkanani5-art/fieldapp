<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024" role="img" aria-label="Kshetralekha">
  <title>Kshetralekha — Rooted Flame</title>
  <defs>
    <clipPath id="kl-frame"><circle cx="60" cy="60" r="54"/></clipPath>
    <clipPath id="kl-drop"><path d="M60 14 C86 38 94 62 84 84 C78 96 69 102 60 102 C51 102 42 96 36 84 C26 62 34 38 60 14 Z"/></clipPath>
  </defs>

  <!-- 1. Sky / background -->
  <circle cx="60" cy="60" r="54" fill="#F4F1E8"/>

  <g clip-path="url(#kl-frame)">
    <!-- 2. Biochar soil (horizon at y=74) -->
    <rect x="0" y="74" width="120" height="50" fill="#1E1F1C"/>
    <!-- 3. Roots -->
    <path d="M60 74 C60 86 58 96 60 110" stroke="#EDB04A" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M60 80 C52 86 44 90 36 100" stroke="#EDB04A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M60 80 C68 86 76 90 84 100" stroke="#EDB04A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M59 90 C52 96 48 102 46 112" stroke="#EDB04A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M61 90 C68 96 72 102 74 112" stroke="#EDB04A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- 4. Biochar granules -->
    <circle cx="26" cy="86" r="2" fill="#D08A2E"/>
    <circle cx="38" cy="112" r="1.6" fill="#D08A2E"/>
    <circle cx="92" cy="86" r="2" fill="#D08A2E"/>
    <circle cx="100" cy="104" r="1.6" fill="#D08A2E"/>
    <circle cx="22" cy="104" r="1.6" fill="#D08A2E"/>
    <circle cx="86" cy="112" r="1.8" fill="#D08A2E"/>
  </g>

  <!-- 5. Flame-to-Leaf drop, planted on the horizon (scaled 0.64, base at 60,74) -->
  <g transform="translate(60 74) scale(0.64) translate(-60 -102)">
    <g clip-path="url(#kl-drop)">
      <rect x="0" y="0" width="60" height="120" fill="#D08A2E"/>
      <rect x="60" y="0" width="60" height="120" fill="#2E7D4F"/>
      <path d="M60 34 C48 50 40 64 42 80 C44 92 52 98 60 99 Z" fill="#EDB04A"/>
      <path d="M60 52 C66 48 72 44 77 37 M60 68 C68 64 76 60 82 53 M60 84 C68 82 74 78 80 72" stroke="#F4F1E8" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M60 18 L60 104" stroke="#F4F1E8" stroke-width="3.5"/>
    </g>
  </g>
</svg>
