name: Build the server image

# Builds the live-server image on every change to the app and publishes it to GitHub's container registry
# (ghcr.io/<owner>/kshetralekha). Azure Container Apps pulls :latest from there.
on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, deploy/**, Dockerfile, .dockerignore, .github/workflows/container.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kshetralekha:latest
            ghcr.io/${{ github.repository_owner }}/kshetralekha:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
